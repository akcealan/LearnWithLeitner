<!DOCTYPE html>
<html class="dark" lang="tr">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Çalışma Ekranı - Learn with Leitner</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link rel="stylesheet" href="css/app.css"/>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#38bdf8",
            "background-light": "#f6f7f8",
            "background-dark": "#111827",
            "card-dark": "#1f2937",
            "border-dark": "#374151"
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.5rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    :focus-visible {
      outline: 2px solid #38bdf8 !important;
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
    
    html:not(.dark) {
      background-color: #f6f7f8 !important;
      color: #1f2937 !important;
    }
    
    html:not(.dark) body {
      background-color: #f6f7f8 !important;
      color: #1f2937 !important;
    }
    
    html:not(.dark) main {
      background-color: #f6f7f8 !important;
    }
    
    html:not(.dark) h1,
    html:not(.dark) h2,
    html:not(.dark) h3,
    html:not(.dark) p,
    html:not(.dark) span,
    html:not(.dark) div {
      color: #1f2937 !important;
    }
    
    html:not(.dark) .text-slate-50 {
      color: #1f2937 !important;
    }
    
    html:not(.dark) header {
      background-color: rgba(255, 255, 255, 0.95) !important;
      border-color: #e5e7eb !important;
    }
    
    html:not(.dark) .bg-card-dark {
      background-color: #ffffff;
    }
    
    html:not(.dark) .border-border-dark {
      border-color: #e5e7eb;
    }
    
    html:not(.dark) .text-slate-100,
    html:not(.dark) .text-slate-200 {
      color: #1f2937;
    }
    
    html:not(.dark) .text-slate-300,
    html:not(.dark) .text-slate-400 {
      color: #6b7280;
    }
    
    html:not(.dark) .bg-slate-700 {
      background-color: #e5e7eb;
      color: #1f2937;
    }
    
    html:not(.dark) .bg-slate-700:hover {
      background-color: #d1d5db;
    }
    
    html:not(.dark) .bg-red-900\/40 {
      background-color: rgba(159, 18, 57, 0.1);
      color: #991b1b;
    }
    
    html:not(.dark) .bg-red-900\/40:hover {
      background-color: rgba(159, 18, 57, 0.15);
    }
    
    html:not(.dark) .bg-green-900\/40 {
      background-color: rgba(20, 83, 45, 0.1);
      color: #166534;
    }
    
    html:not(.dark) .bg-green-900\/40:hover {
      background-color: rgba(20, 83, 45, 0.15);
    }
    
    html:not(.dark) #modal-title {
      color: #1f2937;
    }
    
    html:not(.dark) #modal-message {
      color: #6b7280;
    }
    
    html:not(.dark) #modal-cancel {
      background-color: #e5e7eb;
      color: #1f2937;
      border-color: #d1d5db;
    }
    
    html:not(.dark) #modal-cancel:hover {
      background-color: #d1d5db;
    }
    
    html:not(.dark) #modal-confirm {
      background-color: #dc2626;
      color: #ffffff;
    }
    
    html:not(.dark) #modal-confirm:hover {
      background-color: #b91c1c;
    }
    
    html:not(.dark) a {
      color: #38bdf8;
    }
    
    .flip-card-inner {
      transform-style: preserve-3d;
      transition: transform 0.6s;
    }
    .flip-card-inner.flipped {
      transform: rotateY(180deg);
    }
    .flip-card-front,
    .flip-card-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-card-back {
      transform: rotateY(180deg);
    }
    #flip-card {
      cursor: pointer;
    }
    #flip-card:focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 4px;
      border-radius: 0.75rem;
    }
  </style>
</head>
<body class="font-display bg-background-dark text-slate-200">
<a href="#study-main" class="sr-only focus:not-sr-only focus:absolute focus:top-2 focus:left-2 focus:z-[100] focus:px-4 focus:py-2 focus:rounded-lg focus:bg-primary focus:text-slate-900 focus:font-bold focus:text-sm">Ana içeriğe atla</a>
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<div class="flex flex-1 justify-center py-5 px-4 md:px-10 lg:px-40">
<div class="layout-content-container flex flex-col max-w-[960px] flex-1 w-full min-w-0 lp-enter">
<div class="flex justify-between items-center gap-2 px-4 py-3 border-b border-border-dark">
<div class="flex items-center gap-4 min-w-0 flex-1">
<img data-app-mark="leitner" src="assets/favicon.svg" alt="" width="22" height="22" class="flex-shrink-0"/>
<h1 class="text-xl font-bold text-slate-100 truncate" id="deck-title">Deste Adı</h1>
<span id="study-mode-badge" class="flex-shrink-0 rounded-full bg-primary/15 px-3 py-1 text-xs font-bold text-primary"></span>
</div>
<div class="flex gap-2 flex-shrink-0">
<button id="close-btn" aria-label="Çalışmayı kapat" class="min-w-[44px] min-h-[44px] inline-flex items-center justify-center p-2 text-slate-300 hover:bg-slate-700 hover:text-red-400 rounded-full transition-colors">
<span aria-hidden="true" class="material-symbols-outlined">close</span>
</button>
</div>
</div>
<div id="study-main" class="flex flex-col flex-grow justify-center p-4">
<p id="study-mode-note" class="hidden text-center text-slate-400 text-xs mb-4"></p>
<div id="card-container"></div>
<div class="flex flex-col items-center mt-8">
<div class="w-full max-w-[560px]">
<div class="flex flex-col gap-2 p-4" id="progress-bar">
<div class="flex items-center gap-6 justify-between">
<p class="text-sm font-medium text-slate-400">İlerleme</p>
<p class="text-sm font-medium text-slate-200" id="progress-text" aria-live="polite">0 / 0</p>
</div>
<div id="progress-track" class="rounded-full bg-slate-700" role="progressbar" aria-label="Çalışma ilerlemesi" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
<div id="progress-fill" class="h-2 rounded-full bg-primary transition-all duration-300" style="width: 0%;"></div>
</div>
</div>
<div class="flex flex-col min-[380px]:flex-row flex-1 gap-4 px-4 py-3 justify-center" id="button-container">
<button id="wrong-btn" class="flex min-w-[112px] min-h-[56px] flex-1 cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-red-900/40 text-red-300 text-base font-bold leading-normal tracking-[0.015em] hover:bg-red-900/60 active:scale-[0.98] transition disabled:opacity-50 disabled:cursor-not-allowed">
<span class="truncate">Bilemedim (1)</span>
</button>
<button id="correct-btn" class="flex min-w-[112px] min-h-[56px] flex-1 cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-green-900/40 text-green-300 text-base font-bold leading-normal tracking-[0.015em] hover:bg-green-900/60 active:scale-[0.98] transition disabled:opacity-50 disabled:cursor-not-allowed">
<span class="truncate">Bildim (2)</span>
</button>
</div>
</div>
</div>
</div>
</div>
</div>
</div>

<!-- Confirmation Modal -->
<div id="confirmation-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/50 backdrop-blur-sm p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
  <div class="bg-card-dark rounded-xl border border-border-dark shadow-2xl shadow-black/50 w-96 max-w-full max-h-[90vh] overflow-y-auto p-6 animate-in">
    <h2 id="modal-title" class="text-xl font-bold text-slate-100 mb-2">Onay Gerekli</h2>
    <p id="modal-message" class="text-slate-400 text-sm mb-6 break-words"></p>
    <div class="flex gap-3">
      <button id="modal-cancel" class="flex-1 min-h-[44px] px-4 py-2.5 rounded-lg bg-slate-700 text-slate-100 font-semibold hover:bg-slate-600 transition-colors text-sm">
        Devam Et
      </button>
      <button id="modal-confirm" class="flex-1 min-h-[44px] px-4 py-2.5 rounded-lg bg-red-600 text-white font-semibold hover:bg-red-700 transition-colors text-sm">
        Çık
      </button>
    </div>
  </div>
</div>

</body>
<script src="js/storage.js"></script>
<script src="js/utils.js"></script>
<script src="js/app.js"></script>
</html>
